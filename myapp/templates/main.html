<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 24px;
            color: #f1f5f9;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .nav-links a {
            flex: 1;
            text-decoration: none;
            color: #38bdf8;
            background-color: #0f172a;
            border: 1px solid #0284c7;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-links a:hover {
            background-color: #0284c7;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome</h1>
        <div class="nav-links">
            <a href="{% url "authors" %}">authors</a>
            <a href="{% url "books" %}">books</a>
        </div>
    </div>
</body>
</html>
