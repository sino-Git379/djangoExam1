<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>books</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #0f172a;
            text-align: center;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .book-item {
            text-decoration: none;
            color: #0284c7;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: block;
        }

        .book-item:hover {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
        }

        .add-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background-color: #16a34a;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .add-btn:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Books below</h1>

        <div class="book-list">
            {% for b in books %}
                <a class="book-item" href="{% url 'books_detail' b.pk %}">book title: {{ b.title }}</a>
            {% endfor %}
        </div>

        <a class="add-btn" href="{% url "add_book" %}">add</a>
    </div>
</body>
</html>
