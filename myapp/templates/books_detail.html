<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ object.title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #0f172a;
            text-align: center;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .info-item {
            font-size: 15px;
            color: #475569;
            line-height: 1.4;
        }

        .info-item strong {
            color: #0284c7;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease;
        }

        .btn-edit {
            background-color: #0284c7;
            color: #ffffff;
        }

        .btn-edit:hover {
            background-color: #0369a1;
        }

        .btn-delete {
            background-color: #ef4444;
            color: #ffffff;
        }

        .btn-delete:hover {
            background-color: #dc2626;
        }

        form {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Book Details</h1>

        <div class="info-list">
            <p class="info-item"><strong>Title:</strong> {{ object.title }}</p>
            <p class="info-item"><strong>Author:</strong> {{ object.author }}</p>
            <p class="info-item"><strong>Pages:</strong> {{ object.pages }}</p>
            <p class="info-item"><strong>Price:</strong> {{ object.price }}</p>
            <p class="info-item"><strong>Description:</strong> {{ object.description }}</p>
        </div>

        <div class="btn-group">
            <a href="{% url 'update' object.pk %}" class="btn btn-edit">edit</a>
            
            <form action="{% url 'book_delete' object.pk %}" method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-delete" style="width: 100%;">delete</button>
            </form>
        </div>
    </div>
</body>
</html>
